name: test
on:
  push:
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OpenGPU stream headers for test_gpu (DalsinAI/gfopensdk, MIT), pinned.
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopensdk
          ref: 79e8d48151082ef2ee3cfe97998ebb80eec2aa86
          path: gfopensdk
          sparse-checkout: Include/gfopengpu
      # GFOpenLayout (DalsinAI/gfopenlayout, MIT), pinned, for test_make_ui.
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopenlayout
          ref: c414f38fedcea1ea6c9a00ab3a12bf5214358678
          path: gfopenlayout
      - run: make -C gfopenlayout build/libopenlayout.a
      - run: make test SDK=$GITHUB_WORKSPACE/gfopensdk/Include LAYOUT=$GITHUB_WORKSPACE/gfopenlayout
  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cad/bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
